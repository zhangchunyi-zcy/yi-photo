# 推送 main 后同步静态站到腾讯云香港 COS，并刷新 CDN。
# Secrets: TENCENT_SECRET_ID, TENCENT_SECRET_KEY, COS_BUCKET；可选 CDN_DOMAIN

name: Deploy to Tencent COS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  COS_REGION: ap-hongkong
  COSCLI_VERSION: v1.0.9

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install coscli
        run: |
          curl -fsSL "https://github.com/tencentyun/coscli/releases/download/${COSCLI_VERSION}/coscli-${COSCLI_VERSION}-linux-amd64" -o coscli
          chmod +x coscli
          sudo mv coscli /usr/local/bin/coscli
          coscli --version

      - name: Prepare staging site
        run: |
          # 只打包站点文件，避免同步仓库杂项；也避开 coscli 默认在源目录写 coscli_output 的冲突
          STAGING="${RUNNER_TEMP}/yi-photo-site"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp index.html contact.html "$STAGING/"
          cp -R css js photos "$STAGING/"
          echo "STAGING=$STAGING" >> "$GITHUB_ENV"
          echo "Staging contents:"
          find "$STAGING" -maxdepth 2 -type d | head -40
          du -sh "$STAGING" "$STAGING/photos"

      - name: Sync site to COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
        run: |
          if [ -z "$TENCENT_SECRET_ID" ] || [ -z "$TENCENT_SECRET_KEY" ] || [ -z "$COS_BUCKET" ]; then
            echo "Missing required secrets: TENCENT_SECRET_ID / TENCENT_SECRET_KEY / COS_BUCKET"
            exit 1
          fi
          FAIL_DIR="${RUNNER_TEMP}/coscli_fail"
          LOG_DIR="${RUNNER_TEMP}/coscli_process"
          mkdir -p "$FAIL_DIR" "$LOG_DIR"

          # 已在本地用 coscli v1.0.9 验证：
          # 1) sync . 会因 failOutputPath 落在源目录而失败
          # 2) 使用仓库外 staging + --fail-output-path /tmp 可越过该检查
          coscli sync "${STAGING}/" "cos://${COS_BUCKET}/" \
            -e "cos.${COS_REGION}.myqcloud.com" \
            -i "${TENCENT_SECRET_ID}" \
            -k "${TENCENT_SECRET_KEY}" \
            --init-skip \
            -r \
            --fail-output-path "${FAIL_DIR}" \
            --process-log-path "${LOG_DIR}"

      - name: Purge CDN cache
        env:
          CDN_DOMAIN: ${{ secrets.CDN_DOMAIN }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          if [ -z "$CDN_DOMAIN" ]; then
            echo "CDN_DOMAIN secret not set, skipping CDN purge"
            exit 0
          fi
          python3 << 'PY'
          import hashlib, hmac, json, os, sys, time, urllib.request

          secret_id = os.environ["TENCENT_SECRET_ID"]
          secret_key = os.environ["TENCENT_SECRET_KEY"]
          service = "cdn"
          host = "cdn.tencentcloudapi.com"
          payload = json.dumps({"Paths": ["/"], "FlushType": "flush"})
          timestamp = int(time.time())
          date = time.strftime("%Y-%m-%d", time.gmtime(timestamp))

          def sign(key, msg):
              return hmac.new(key, msg.encode("utf-8"), hashlib.sha256).digest()

          canonical_request = (
              "POST\n/\n\ncontent-type:application/json; charset=utf-8\nhost:" + host + "\n\n"
              "content-type;host\n" + hashlib.sha256(payload.encode()).hexdigest()
          )
          scope = date + "/" + service + "/tc3_request"
          sts = (
              "TC3-HMAC-SHA256\n" + str(timestamp) + "\n" + scope + "\n"
              + hashlib.sha256(canonical_request.encode()).hexdigest()
          )
          sig = hmac.new(
              sign(sign(sign(("TC3" + secret_key).encode(), date), service), "tc3_request"),
              sts.encode(),
              hashlib.sha256,
          ).hexdigest()
          auth = (
              "TC3-HMAC-SHA256 Credential=" + secret_id + "/" + scope
              + ", SignedHeaders=content-type;host, Signature=" + sig
          )
          req = urllib.request.Request(
              "https://" + host,
              data=payload.encode(),
              headers={
                  "Authorization": auth,
                  "Content-Type": "application/json; charset=utf-8",
                  "Host": host,
                  "X-TC-Action": "PurgePathCache",
                  "X-TC-Timestamp": str(timestamp),
                  "X-TC-Version": "2018-06-06",
                  "X-TC-Region": "",
              },
              method="POST",
          )
          try:
              print(urllib.request.urlopen(req, timeout=30).read().decode())
          except Exception as e:
              print("CDN purge failed (non-fatal):", e, file=sys.stderr)
          PY
